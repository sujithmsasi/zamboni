# =============================================================================
# Zamboni — Deploy Workflow
# Triggers on push to dev or main (i.e. when a PR is merged).
# Runs the same lint + unit tests as CI.
# CodePipeline is triggered automatically by the CodeStar connection
# when it detects the push — no manual trigger needed here.
#
# Flow:
#   PR merged → this workflow runs tests → CodeStar detects push
#   → CodePipeline triggers automatically → CodeBuild → CodeDeploy → EC2
# =============================================================================

name: Deploy Gate

on:
  push:
    branches:
      - dev
      - main

jobs:
  pre-deploy-checks:
    name: Pre-Deploy Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check . --select E,F,W,I --ignore E501

      - name: Run unit tests
        env:
          AWS_REGION: us-west-2
          AWS_ACCOUNT_ID: "123456789012"
          AWS_DEFAULT_REGION: us-west-2
          ATHENA_CATALOG: glue_catalog
          ATHENA_DATABASE: zamboni_catalog
          ATHENA_RESULTS_BUCKET: s3://mock-athena-results/
          STAGING_BUCKET: s3://mock-staging/
          ARCHIVE_BUCKET: s3://mock-archive/
          ZAMBONI_METADATA_BUCKET: s3://mock-metadata/
          SNS_ALERT_TOPIC_ARN: arn:aws:sns:us-west-2:123456789012:mock-alerts
          SNS_GREENZONE_TOPIC_ARN: arn:aws:sns:us-west-2:123456789012:mock-greenzone
          DRY_RUN_DEFAULT: "true"
          LOG_LEVEL: WARNING
        run: |
          pytest tests/unit/ -v \
            -m "not integration" \
            --tb=short \
            --override-ini="addopts="

      - name: Confirm branch
        run: |
          echo "Branch  : ${{ github.ref_name }}"
          echo "Commit  : ${{ github.sha }}"
          echo "Author  : ${{ github.actor }}"
          echo ""
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "⚠  PRODUCTION branch — CodePipeline will require DO team approval before prod deploy."
          else
            echo "✅ DEV branch — CodePipeline will deploy to dev EC2 automatically."
          fi
