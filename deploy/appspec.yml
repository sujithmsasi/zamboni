# =============================================================================
# Zamboni — CodeDeploy AppSpec
# Instructs the CodeDeploy agent on EC2 how to deploy the application.
#
# Hooks run in this order:
#   BeforeInstall    → stop zamboni-api + control-plane services, backup .env
#   [Install]        → CodeDeploy copies files to /opt/zamboni/
#   AfterInstall     → restore .env, pip install, set permissions
#   ApplicationStart → start zamboni-api + control-plane services, validate connectivity
# =============================================================================

version: 0.0
os: linux

files:
  - source: /
    destination: /opt/zamboni

hooks:
  BeforeInstall:
    - location: deploy/scripts/before_install.sh
      timeout: 120
      runas: root

  AfterInstall:
    # Bumped from 300s -- creates/updates a venv and installs
    # requirements.txt into it for zamboni-api.service.
    - location: deploy/scripts/after_install.sh
      timeout: 600
      runas: root

  ApplicationStart:
    # Bumped from 120s -- starts and health-checks zamboni-api (:8000) and
    # the control-plane sync/backup services.
    - location: deploy/scripts/app_start.sh
      timeout: 180
      runas: root
