[theme]
primaryColor             = "#3b82f6"
backgroundColor          = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor                = "#e2e8f0"
font                     = "sans serif"

[server]
headless         = true
port             = 8501
# enableCORS removed — default (true) is compatible with XSRF protection

[browser]
# Disable telemetry — Streamlit sends usage data to Snowflake by default.
# This must be false for enterprise/internal tools.
gatherUsageStats = false

[runner]
magicEnabled     = false
# Suppress plotly Line deprecation and other 3rd-party warnings
fastReruns       = true


[deprecation]
suppressDeprecationWarnings = true
